[project]
name = "ctxlab"
version = "0.1.0"
description = "Collaborative research lab for language-model context arrangements and (later) test-time training."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ctxlab contributors" }]
dependencies = [
    "datasets>=3.0",
    "litellm>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
local = [
    "accelerate>=0.34",
    "torch>=2.4",
    "transformers>=4.44",
]
wandb = [
    "wandb>=0.17",
]

[project.scripts]
ctxlab = "ctxlab.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxlab"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/ctxlab/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
