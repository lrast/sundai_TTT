extends: ../base.yaml
run_id: bugloc_anon10
system_prompt: >-
  You are given several Python functions, each labeled with its name.
  Exactly one of them contains a residual bug.
  Reply with the name of the buggy function only, with no explanation.
dataset:
  name: pyresbugs
  hub_id: OSS-forge/PyResBugs
  split: train
  n: 50
  seed: 0
  extra:
    question_style: anonymous
    n_distractors: 9
arrangements:
  - no_context
  - gold_only
  - gold_first
  - gold_last
  - gold_middle
  - shuffled
metrics: [em, f1, mention]
models:
  - name: gpt-4o-mini
    kind: api
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 24
  - name: gpt-5.6-luna
    kind: api
    model: gpt-5.6-luna
    temperature: 0.0
    max_tokens: 2048
    extra:
      drop_params: true
